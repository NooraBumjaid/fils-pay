# Dilmune / hosted overlay for ops/docker-compose.yml.
# Target box: 1 vCPU, 2 GB RAM. API cap: 0.5 vCPU / 512 MB.
#
# CPU budget (must stay ≤ 1.00): postgres 0.20 + api 0.50 + settlement 0.15
# + reporting 0.10 + proxy 0.05 = 1.00.
#
# Dilmune may already have a locally edited compose/nginx. Diff before
# replacing those files; keep live server_name, TLS, and extra locations.
#
# Usage from repo root:
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.hosted.yml --env-file ops/.env.hosted up -d postgres
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.hosted.yml --env-file ops/.env.hosted run --rm migrate
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.hosted.yml --env-file ops/.env.hosted up -d api settlement reporting proxy
#
# Do not start `seed` on a hosted box unless you intend to wipe fixture tables.

services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    mem_limit: 384m
    cpus: "0.20"
    restart: unless-stopped

  api:
    # Compose merges `ports` by concatenation. A bare `ports: []` does NOT
    # unpublish the base file's `3000:3000`. Dilmune uses `!override []`
    # (equivalent: `!reset []`) so the API is only on the compose network
    # (nginx → api:3000).
    ports: !override []
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      SHARP_CACHE: "0"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?SETTLEMENT_INTERNAL_TOKEN must be set}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY must be set}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?ACQUIRER_CALLBACK_SIGNING_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Public origin for minted /pay/:token URLs. Must be set in ops/.env.hosted
      # to the origin judges open. Do not leave this on localhost in production.
      CHECKOUT_BASE_URL: ${CHECKOUT_BASE_URL:?CHECKOUT_BASE_URL must be set}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  settlement:
    # Dockerfile.go ENTRYPOINT is `/settlement`. Extra args are the
    # subcommand only — `["./settlement", "daemon"]` would become
    # `/settlement ./settlement daemon` and never start the daemon.
    command: ["daemon"]
    mem_limit: 256m
    cpus: "0.15"
    restart: unless-stopped
    environment:
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?SETTLEMENT_INTERNAL_TOKEN must be set}

  reporting:
    mem_limit: 192m
    cpus: "0.10"
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=128

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.hosted.conf:/etc/nginx/conf.d/default.conf:ro
      - ./spa/web:/usr/share/nginx/html/web:ro
      - ./spa/admin:/usr/share/nginx/html/admin:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 32m
    cpus: "0.05"
    restart: unless-stopped
