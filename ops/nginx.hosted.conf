limit_req_zone $binary_remote_addr zone=filspay_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # JSON 429 for API clients. Checkout is a handful of /v1/ calls per
    # payment; 20 r/s with burst 40 is well above a normal session.
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limited"}';
    }

    location /healthz {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=filspay_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Admin console (built with VITE_BASE=/admin/). Must be before `/`.
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin {
        return 301 /admin/;
    }

    # Merchant dashboard + checkout (`/pay/:token`).
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }
}
