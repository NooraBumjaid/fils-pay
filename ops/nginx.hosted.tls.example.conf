# Example TLS server block. Do not enable until a real certificate exists
# for the public hostname. Replace the three placeholders below; do not
# invent a domain or a certificate.
#
#   YOUR_PUBLIC_HOSTNAME
#   /etc/ssl/filspay/fullchain.pem
#   /etc/ssl/filspay/privkey.pem
#
# After TLS terminates here, set COOKIE_SECURE=true in ops/.env.hosted.
# Keep the HTTP server listening on 80 for ACME http-01, or redirect it.

limit_req_zone $binary_remote_addr zone=filspay_api:10m rate=20r/s;

server {
    listen 80;
    server_name YOUR_PUBLIC_HOSTNAME;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_PUBLIC_HOSTNAME;
    client_max_body_size 8m;

    ssl_certificate     /etc/ssl/filspay/fullchain.pem;
    ssl_certificate_key /etc/ssl/filspay/privkey.pem;

    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limited"}';
    }

    location /healthz {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /readyz {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        limit_req zone=filspay_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin {
        return 301 /admin/;
    }

    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }
}
